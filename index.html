<!DOCTYPE html>
<html>
<head>
    <title>Simple AI Chess</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background: #161618; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #board { width: 450px; border: 4px solid #333; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="board"></div>

<script src="https://jquery.com"></script>
<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>
<script>
    const game = new Chess();
    let board = null;

    // Simple evaluation weights to let the bot make instant choices
    const weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function makeBotMove() {
        if (game.game_over()) return;
        
        let moves = game.moves({ verbose: true });
        // Sort moves so the bot prefers to capture high value pieces
        moves.sort((a, b) => {
            let scoreA = a.captured ? weights[a.captured] : 0;
            let scoreB = b.captured ? weights[b.captured] : 0;
            return scoreB - scoreA;
        });

        // Play the highest priority strategic move instantly
        if (moves.length > 0) {
            game.move(moves[0]);
            board.position(game.fen());
        }
    }

    function onDrop(source, target) {
        if (game.turn() === 'b' || game.game_over()) return 'snapback';
        
        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        // Bot responds immediately right after your piece drops
        window.setTimeout(makeBotMove, 200);
    }

    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDrop: onDrop,
        onSnapEnd: () => board.position(game.fen()),
        pieceTheme: 'https://chessboardjs.com{piece}.png'
    });
</script>
</body>
</html>
